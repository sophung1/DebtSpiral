name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * 1'   # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refresh data/live.json before deploying'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh live data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        run: npm run fetch-data

      - run: npm test
      - run: npm run build

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet data/live.json; then echo "No data changes"; exit 0; fi
          git config user.name "debtspiral-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data: refresh live.json"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
